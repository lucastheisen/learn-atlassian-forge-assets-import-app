---
app:
  id: ari:cloud:ecosystem::app/a830c4dc-a700-401b-96af-e97aeb4b159a
  package:
    bundler: manual@2026
    path: dist/backend
  runtime:
    architecture: arm64
    memoryMB: 256
    name: nodejs24.x
modules:
  consumer:
    - function: workerQueueFunction
      key: assets-import-app-uk2-assets-imports-tutorial-worker-queue-consumer
      queue: worker-queue
    - function: referenceQueueFunction
      key: user-reference-consumer
      queue: reference-queue
  function:
    - handler: index.handler
      key: resolver
    - handler: index.onDeleteImport
      key: onDeleteImport
    - handler: index.startImport
      key: startImport
    - handler: index.stopImport
      key: stopImport
    - handler: index.importStatus
      key: importStatus
    # createWorkerBudget subtracts finalizationBudgetMs from the actual timeout of each worker.
    - handler: index.workerHandler
      key: workerQueueFunction
      timeoutSeconds: 300
    - handler: index.referenceHandler
      key: referenceQueueFunction
      timeoutSeconds: 300
    - handler: index.recoverImports
      key: recoverImports
    - handler: index.webtriggerDispatch
      key: webtriggerDispatch
  scheduledTrigger:
    - function: recoverImports
      interval: fiveMinute
      key: import-recovery
  jiraServiceManagement:assetsImportType:
    - description: User import.
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      importStatus:
        function: importStatus
      key: lucas-laptop-assets-import-app-hello-world-import-type
      onDeleteImport:
        function: onDeleteImport
      render: native
      resolver:
        function: resolver
      resource: main
      startImport:
        function: startImport
      stopImport:
        function: stopImport
      title: lucas-laptop-assets-import-app
  webtrigger:
    - function: webtriggerDispatch
      key: webtrigger-dispatch
      response:
        outputs:
          - body: |
              {"status": 200,"title":"success"}
            contentType: application/json
            key: status-ok
            statusCode: 200
          - body: |
              {"status":202,"title":"import pending","phase":"queued"}
            contentType: application/json
            key: smoke-pending-queued
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"starting"}
            contentType: application/json
            key: smoke-pending-starting
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"ingesting"}
            contentType: application/json
            key: smoke-pending-ingesting
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"polling"}
            contentType: application/json
            key: smoke-pending-polling
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"discovery"}
            contentType: application/json
            key: smoke-pending-discovery
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"processing"}
            contentType: application/json
            key: smoke-pending-processing
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"aggregation"}
            contentType: application/json
            key: smoke-pending-aggregation
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"finalizing"}
            contentType: application/json
            key: smoke-pending-finalizing
            statusCode: 202
          - body: |
              {"status":202,"title":"import pending","phase":"objects"}
            contentType: application/json
            key: smoke-pending-objects
            statusCode: 202
          - body: |
              {"status":409,"title":"smoke assertion failed"}
            contentType: application/json
            key: smoke-failed
            statusCode: 409
          - body: |
              {"status":400,"title":"bad request"}
            contentType: text/plain
            key: status-error-bad-request
            statusCode: 400
          - body: |
              {"status":400,"title":"your request parameters didn't validate"}
            contentType: text/plain
            key: status-error-bad-request-validate
            statusCode: 400
          - body: |
              {"status":401,"title":"unauthorized"}
            contentType: text/plain
            key: status-error-unauthorized
            statusCode: 401
          - body: |
              {"status":403,"title":"forbidden"}
            contentType: text/plain
            key: status-error-forbidden
            statusCode: 403
          - body: |
              {"status":500,"title":"internal server error"}
            contentType: text/plain
            key: status-error-internal-server-error
            statusCode: 500
        type: static
      urlFormat: v2
permissions:
  content:
    scripts:
      - unsafe-inline
      - unsafe-eval
    styles:
      - unsafe-inline
  scopes:
    - delete:cmdb-object:jira
    - import:import-configuration:cmdb
    - read:cmdb-attribute:jira
    - read:cmdb-object:jira
    - read:cmdb-schema:jira
    - read:cmdb-type:jira
    - read:email-address:jira
    - read:jira-user
    - storage:app
    - write:cmdb-object:jira
resources:
  - bundler: manual@2026
    key: main
    path: dist/frontend
