---
app:
  id: ari:cloud:ecosystem::app/a830c4dc-a700-401b-96af-e97aeb4b159a
  runtime:
    architecture: arm64
    memoryMB: 256
    name: nodejs24.x
modules:
  consumer:
    - function: workerQueueFunction
      key: assets-import-app-uk2-assets-imports-tutorial-worker-queue-consumer
      queue: worker-queue
    - function: controllerQueueFunction
      key: assets-import-app-uk2-assets-imports-tutorial-controller-queue-consumer
      queue: controller-queue
  function:
    - handler: index.handler
      key: resolver
    - handler: index.onDeleteImport
      key: onDeleteImport
    - handler: index.startImport
      key: startImport
    - handler: index.stopImport
      key: stopImport
    - handler: index.importStatus
      key: importStatus
    - handler: index.workerHandler
      key: workerQueueFunction
    - handler: index.controllerHandler
      key: controllerQueueFunction
    - handler: index.webtriggerPrune
      key: webtriggerPrune
  jiraServiceManagement:assetsImportType:
    - description: User import.
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      importStatus:
        function: importStatus
      key: lucas-laptop-assets-import-app-hello-world-import-type
      onDeleteImport:
        function: onDeleteImport
      render: native
      resolver:
        function: resolver
      resource: main
      startImport:
        function: startImport
      stopImport:
        function: stopImport
      title: lucas-laptop-assets-import-app
  webtrigger:
    - function: webtriggerPrune
      key: lucas-laptop-assets-import-app-webtrigger-prune
      response:
        outputs:
          - body: '{"status": "ok"}'
            contentType: application/json
            key: status-ok
            statusCode: 200
          - body: '{"status": "error"}'
            contentType: text/plain
            key: status-error-unauthorized
            statusCode: 401
          - body: '{"status": "error"}'
            contentType: text/plain
            key: status-error-forbidden
            statusCode: 403
          - body: '{"status": "error"}'
            contentType: text/plain
            key: status-error-internal-server-error
            statusCode: 500
        type: static
permissions:
  content:
    scripts:
      - unsafe-inline
      - unsafe-eval
    styles:
      - unsafe-inline
  scopes:
    - import:import-configuration:cmdb
    - read:cmdb-attribute:jira
    - read:cmdb-object:jira
    - read:cmdb-schema:jira
    - read:cmdb-type:jira
    - write:cmdb-object:jira
    - storage:app
resources:
  - key: main
    path: src/frontend/index.tsx
